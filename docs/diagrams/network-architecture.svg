<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#334155"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#15803d"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="600" fill="#0f172a">Innovatech Solutions, as-built network architecture</text>
  <text x="24" y="52" font-size="12" fill="#64748b">AWS eu-central-1 · hub and spoke over Transit Gateway · REQ-NCA-P2-01 to P2-04</text>

  <!-- ON PREM (not joined) -->
  <rect x="24" y="86" width="228" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="110" font-size="12" font-weight="600" fill="#475569">PHYSICAL ON-PREMISES</text>
  <text x="40" y="128" font-size="10" fill="#64748b">192.168.100.0/24</text>
  <text x="40" y="150" font-size="10" fill="#94a3b8">Reached over the Tailscale mesh.</text>
  <text x="40" y="166" font-size="10" fill="#94a3b8">Designed and routed for, but no</text>
  <text x="40" y="182" font-size="10" fill="#94a3b8">physical host was joined within</text>
  <text x="40" y="198" font-size="10" fill="#94a3b8">the project window. Recorded as</text>
  <text x="40" y="214" font-size="10" fill="#94a3b8">not tested rather than implied.</text>

  <line x1="252" y1="160" x2="330" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#a)"/>
  <text x="256" y="152" font-size="9" fill="#64748b">WireGuard</text>

  <!-- HUB -->
  <rect x="334" y="86" width="300" height="330" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="110" font-size="13" font-weight="600" fill="#1e3a8a">HUB VPC</text>
  <text x="350" y="127" font-size="10" fill="#1d4ed8">10.0.0.0/16 · shared services · only IGW</text>

  <rect x="350" y="140" width="268" height="62" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="362" y="157" font-size="10" font-weight="600" fill="#0f172a">Public 10.0.0.0/24, 10.0.1.0/24</text>
  <text x="362" y="172" font-size="9" fill="#475569">hybrid-gw: bastion + Tailscale subnet router</text>
  <text x="362" y="186" font-size="9" fill="#475569">NAT gateway (single, documented SPOF)</text>
  <text x="362" y="198" font-size="9" fill="#b91c1c">source/dest check disabled for routing</text>

  <rect x="350" y="210" width="268" height="72" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="362" y="227" font-size="10" font-weight="600" fill="#0f172a">Private 10.0.10.0/24, 10.0.11.0/24</text>
  <text x="362" y="242" font-size="9" fill="#475569">Route53 Resolver inbound 10.0.10.250, .11.194</text>
  <text x="362" y="256" font-size="9" fill="#475569">execute-api interface endpoint</text>
  <text x="362" y="270" font-size="9" fill="#475569">innovatech.internal private hosted zone</text>

  <rect x="350" y="290" width="268" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="3 2"/>
  <text x="362" y="309" font-size="9" fill="#1e3a8a">TGW attachment subnets 10.0.240.0/28, .16/28</text>

  <line x1="634" y1="171" x2="686" y2="171" stroke="#2563eb" stroke-width="2"/>
  <circle cx="698" cy="171" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="164" font-size="9" fill="#1d4ed8">IGW</text>

  <!-- TGW -->
  <rect x="394" y="440" width="180" height="70" rx="8" fill="#1e293b"/>
  <text x="484" y="464" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">TRANSIT GATEWAY</text>
  <text x="484" y="482" font-size="9" fill="#cbd5e1" text-anchor="middle">default assoc + propagation OFF</text>
  <text x="484" y="497" font-size="9" fill="#cbd5e1" text-anchor="middle">rt-hub reaches all · rt-spoke reaches hub</text>
  <line x1="484" y1="416" x2="484" y2="440" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- PLATFORM SPOKE -->
  <rect x="24" y="546" width="520" height="322" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="40" y="570" font-size="13" font-weight="600" fill="#14532d">PLATFORM SPOKE</text>
  <text x="40" y="587" font-size="10" fill="#15803d">10.1.0.0/16 · private subnets only, no IGW · default route via TGW</text>

  <rect x="40" y="600" width="488" height="72" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="52" y="617" font-size="10" font-weight="600" fill="#0f172a">k3s server (t3.large)</text>
  <text x="52" y="632" font-size="9" fill="#475569">Prometheus · Alertmanager · Loki · Alloy · Grafana · cloudwatch-exporter</text>
  <text x="52" y="646" font-size="9" fill="#475569">SOAR console container, pulled from ECR</text>
  <text x="52" y="660" font-size="9" fill="#475569">Loki chunks and index written to S3 via gateway endpoint</text>

  <rect x="40" y="682" width="236" height="82" rx="5" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="52" y="699" font-size="10" font-weight="600" fill="#713f12">corp-server (t3.micro)</text>
  <text x="52" y="713" font-size="9" fill="#854d0e">SIMULATED on-premises server</text>
  <text x="52" y="727" font-size="9" fill="#475569">rsyslog · node_exporter · forwarder agent</text>
  <text x="52" y="741" font-size="9" fill="#475569">tails auth.log, posts to the SOAR ingest API</text>
  <text x="52" y="755" font-size="9" fill="#854d0e">tagged Environment=onpremises</text>

  <rect x="290" y="682" width="238" height="82" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="302" y="699" font-size="10" font-weight="600" fill="#0f172a">demo-workstation (t3.micro)</text>
  <text x="302" y="713" font-size="9" fill="#475569">node_exporter, scraped by Prometheus</text>
  <text x="302" y="727" font-size="9" fill="#b91c1c">SOARable=true, quarantine target</text>
  <text x="302" y="741" font-size="9" fill="#475569">security group swapped on isolation</text>

  <rect x="40" y="774" width="488" height="52" rx="5" fill="#ecfdf5" stroke="#16a34a" stroke-dasharray="3 2"/>
  <text x="52" y="791" font-size="9" font-weight="600" fill="#14532d">Gateway endpoints: S3, DynamoDB · Interface endpoint: execute-api</text>
  <text x="52" y="805" font-size="9" fill="#15803d">Network ACL acl-068c30bc… — SOAR writes DENY entries here, rules 100 to 400</text>
  <text x="52" y="819" font-size="9" fill="#15803d">No route between spokes exists except one declared exception to the data spoke</text>

  <line x1="394" y1="492" x2="300" y2="546" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- DATA SPOKE -->
  <rect x="566" y="546" width="290" height="220" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="582" y="570" font-size="13" font-weight="600" fill="#701a75">DATA SPOKE</text>
  <text x="582" y="587" font-size="10" fill="#a21caf">10.2.0.0/16 · NO default route at all</text>

  <rect x="582" y="600" width="258" height="66" rx="5" fill="#ffffff" stroke="#a21caf"/>
  <text x="594" y="617" font-size="10" font-weight="600" fill="#0f172a">S3 gateway endpoint</text>
  <text x="594" y="632" font-size="9" fill="#475569">innovatech-observability-9e024ca1</text>
  <text x="594" y="646" font-size="9" fill="#475569">lifecycle: IA at 30 days, expire at 90</text>
  <text x="594" y="659" font-size="9" fill="#475569">metrics.innovatech.internal</text>

  <rect x="582" y="678" width="258" height="72" rx="5" fill="#fae8ff" stroke="#a21caf" stroke-dasharray="3 2"/>
  <text x="594" y="695" font-size="10" font-weight="600" fill="#701a75">Structural guarantee</text>
  <text x="594" y="710" font-size="9" fill="#86198f">No route to any gateway exists here.</text>
  <text x="594" y="724" font-size="9" fill="#86198f">Internet exposure is impossible regardless</text>
  <text x="594" y="738" font-size="9" fill="#86198f">of security group configuration. REQ-P2-03</text>

  <line x1="554" y1="492" x2="640" y2="546" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- SOAR -->
  <rect x="882" y="86" width="294" height="510" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="898" y="110" font-size="13" font-weight="600" fill="#7f1d1d">SOAR PIPELINE</text>
  <text x="898" y="127" font-size="10" fill="#b91c1c">regional services, no VPC attachment</text>

  <rect x="898" y="140" width="262" height="44" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="910" y="157" font-size="10" font-weight="600" fill="#0f172a">Private API Gateway</text>
  <text x="910" y="173" font-size="9" fill="#475569">resource policy: our VPC endpoints only</text>

  <rect x="898" y="194" width="262" height="44" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="910" y="211" font-size="10" font-weight="600" fill="#0f172a">collector</text>
  <text x="910" y="227" font-size="9" fill="#475569">normalise → DynamoDB + SQS</text>

  <rect x="898" y="248" width="262" height="52" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="910" y="265" font-size="10" font-weight="600" fill="#0f172a">rule engine</text>
  <text x="910" y="280" font-size="9" fill="#475569">declarative playbooks, correlation by source IP</text>
  <text x="910" y="294" font-size="9" fill="#15803d">holds no write permission of any kind</text>

  <rect x="898" y="310" width="262" height="36" rx="5" fill="#1e293b"/>
  <text x="910" y="333" font-size="10" font-weight="600" fill="#ffffff">EventBridge bus, retries, DLQ</text>

  <rect x="898" y="356" width="262" height="38" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="910" y="373" font-size="10" font-weight="600" fill="#0f172a">block_ip</text>
  <text x="910" y="387" font-size="9" fill="#475569">writes a DENY entry into the platform NACL</text>

  <rect x="898" y="402" width="262" height="38" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="910" y="419" font-size="10" font-weight="600" fill="#0f172a">quarantine_host</text>
  <text x="910" y="433" font-size="9" fill="#475569">swaps to an empty security group</text>

  <rect x="898" y="448" width="262" height="38" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="910" y="465" font-size="10" font-weight="600" fill="#0f172a">notify</text>
  <text x="910" y="479" font-size="9" fill="#475569">SNS email to operations</text>

  <rect x="898" y="494" width="262" height="42" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="3 2"/>
  <text x="910" y="511" font-size="9" fill="#7f1d1d">block_expiry, every 5 minutes, lifts blocks</text>
  <text x="910" y="525" font-size="9" fill="#7f1d1d">whose duration has elapsed</text>

  <rect x="898" y="546" width="262" height="42" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-dasharray="3 2"/>
  <text x="910" y="563" font-size="9" fill="#7f1d1d">DynamoDB: events, blocks, quarantines</text>
  <text x="910" y="577" font-size="9" fill="#7f1d1d">reached from the spokes via gateway endpoint</text>

  <!-- Response path: SOAR changes state in the platform spoke. Routed through
       the clear band between the Transit Gateway row and the spokes. -->
  <path d="M 894 375 L 866 375 L 866 528 L 300 528 L 300 546"
        fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="470" y="522" font-size="9" font-weight="600" fill="#b91c1c">automated containment: NACL DENY entry, security group swap</text>

  <!-- Detection paths are shown as short exits rather than long routed lines,
       which would have to cross three labelled boxes to reach the panel. -->
  <rect x="566" y="782" width="290" height="86" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="582" y="800" font-size="10" font-weight="600" fill="#14532d">EVENT SOURCES into the SOAR ingest API</text>
  <text x="582" y="816" font-size="9" fill="#166534">1. Alertmanager on k3s, webhook receiver (REQ-P2-09)</text>
  <text x="582" y="830" font-size="9" fill="#854d0e">2. corp-server forwarder agent, tails auth.log (REQ-P2-06)</text>
  <text x="582" y="844" font-size="9" fill="#166534">3. CloudWatch alarms via SNS</text>
  <text x="582" y="860" font-size="9" fill="#475569">All three POST to the private endpoint, reached from the</text>

  <line x1="528" y1="636" x2="566" y2="800" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="276" y1="722" x2="566" y2="822" stroke="#ca8a04" stroke-width="2" stroke-dasharray="5 3"/>

  <path d="M 856 812 L 872 812 L 872 158 L 894 158"
        fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#ag)"/>

  <text x="24" y="884" font-size="9" fill="#64748b">platform spoke over its own execute-api interface endpoint.  ·  Amber = on-premises source (simulated on EC2)  ·  Green = detection  ·  Red = response  ·  Dashed grey = designed, not exercised</text>
</svg>
