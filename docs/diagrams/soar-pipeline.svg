<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#334155"/>
    </marker>
    <marker id="br" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="600" fill="#0f172a">SOAR event pipeline</text>
  <text x="24" y="52" font-size="12" fill="#64748b">Detection to containment, no human in the path. Measured end to end at under 25 seconds.</text>

  <!-- column headers -->
  <text x="90" y="90" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">SOURCES</text>
  <text x="330" y="90" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">INGEST</text>
  <text x="560" y="90" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">DECIDE</text>
  <text x="850" y="90" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">RESPOND</text>
  <line x1="24" y1="100" x2="976" y2="100" stroke="#e2e8f0" stroke-width="1"/>

  <!-- sources -->
  <rect x="24" y="120" width="132" height="44" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="140" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Alertmanager</text>
  <text x="90" y="155" font-size="9" fill="#64748b" text-anchor="middle">cloud workloads</text>

  <rect x="24" y="176" width="132" height="44" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="196" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">rsyslog</text>
  <text x="90" y="211" font-size="9" fill="#64748b" text-anchor="middle">on-premises hosts</text>

  <rect x="24" y="232" width="132" height="44" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="90" y="252" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">CloudWatch</text>
  <text x="90" y="267" font-size="9" fill="#64748b" text-anchor="middle">managed services</text>

  <path d="M156 142 L196 142 L196 198" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M156 198 L196 198" fill="none" stroke="#334155" stroke-width="1.5"/>
  <path d="M156 254 L196 254 L196 198" fill="none" stroke="#334155" stroke-width="1.5"/>
  <line x1="196" y1="198" x2="252" y2="198" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- ingest -->
  <rect x="256" y="120" width="150" height="48" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="331" y="140" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Private API Gateway</text>
  <text x="331" y="156" font-size="9" fill="#475569" text-anchor="middle">VPC endpoint only</text>

  <rect x="256" y="182" width="150" height="52" rx="5" fill="#eff6ff" stroke="#2563eb"/>
  <text x="331" y="202" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">collector</text>
  <text x="331" y="217" font-size="9" fill="#475569" text-anchor="middle">normalises every source</text>
  <text x="331" y="229" font-size="9" fill="#475569" text-anchor="middle">into one event schema</text>

  <rect x="256" y="248" width="150" height="46" rx="5" fill="#ffffff" stroke="#2563eb" stroke-dasharray="3 2"/>
  <text x="331" y="266" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">DynamoDB events</text>
  <text x="331" y="282" font-size="9" fill="#475569" text-anchor="middle">written before queueing</text>

  <rect x="256" y="304" width="150" height="42" rx="5" fill="#ffffff" stroke="#2563eb" stroke-dasharray="3 2"/>
  <text x="331" y="322" font-size="10" font-weight="600" fill="#1e3a8a" text-anchor="middle">SQS ingest queue</text>
  <text x="331" y="337" font-size="9" fill="#475569" text-anchor="middle">burst absorption + DLQ</text>

  <line x1="331" y1="168" x2="331" y2="182" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="331" y1="234" x2="331" y2="248" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="331" y1="294" x2="331" y2="304" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="406" y1="325" x2="470" y2="325" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- decide -->
  <rect x="474" y="182" width="176" height="76" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="562" y="203" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">rule engine</text>
  <text x="562" y="219" font-size="9" fill="#475569" text-anchor="middle">evaluates declarative</text>
  <text x="562" y="231" font-size="9" fill="#475569" text-anchor="middle">JSON playbooks</text>
  <text x="562" y="248" font-size="9" font-weight="600" fill="#15803d" text-anchor="middle">holds no write permissions</text>

  <rect x="474" y="272" width="176" height="60" rx="5" fill="#ffffff" stroke="#16a34a" stroke-dasharray="3 2"/>
  <text x="562" y="291" font-size="10" font-weight="600" fill="#14532d" text-anchor="middle">correlation</text>
  <text x="562" y="306" font-size="9" fill="#475569" text-anchor="middle">source_ip index answers</text>
  <text x="562" y="320" font-size="9" fill="#475569" text-anchor="middle">"how many in 5 minutes?"</text>

  <line x1="562" y1="332" x2="562" y2="352" stroke="#334155" stroke-width="1.5"/>
  <line x1="470" y1="325" x2="474" y2="325" stroke="#334155" stroke-width="1.5"/>
  <path d="M470 325 L470 220 L474 220" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="474" y="356" width="176" height="42" rx="5" fill="#1e293b"/>
  <text x="562" y="374" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">EventBridge bus</text>
  <text x="562" y="389" font-size="9" fill="#cbd5e1" text-anchor="middle">retries twice, then DLQ</text>

  <!-- respond -->
  <rect x="712" y="120" width="264" height="72" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="728" y="140" font-size="11" font-weight="600" fill="#0f172a">block_ip</text>
  <text x="728" y="157" font-size="9" fill="#475569">writes a DENY entry into the platform NACL</text>
  <text x="728" y="171" font-size="9" fill="#b91c1c" font-weight="600">verifiable: VPC console, Inbound rules</text>
  <text x="728" y="185" font-size="9" fill="#475569">refuses private ranges, expires after 60 min</text>

  <rect x="712" y="204" width="264" height="72" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="728" y="224" font-size="11" font-weight="600" fill="#0f172a">quarantine_host</text>
  <text x="728" y="241" font-size="9" fill="#475569">swaps the instance to an empty security group</text>
  <text x="728" y="255" font-size="9" fill="#b91c1c" font-weight="600">verifiable: EC2 console, Security tab</text>
  <text x="728" y="269" font-size="9" fill="#475569">host stays running, forensics preserved</text>

  <rect x="712" y="288" width="264" height="58" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="728" y="308" font-size="11" font-weight="600" fill="#0f172a">notify</text>
  <text x="728" y="325" font-size="9" fill="#475569">publishes to SNS, delivered by email</text>
  <text x="728" y="339" font-size="9" fill="#475569">the audit trail a human reads</text>

  <path d="M650 377 L680 377 L680 156 L712 156" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#br)"/>
  <path d="M680 240 L712 240" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#br)"/>
  <path d="M680 317 L712 317" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#br)"/>

  <!-- expiry -->
  <rect x="712" y="360" width="264" height="42" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-dasharray="3 2"/>
  <text x="728" y="378" font-size="10" font-weight="600" fill="#7f1d1d">block_expiry, scheduled every 5 minutes</text>
  <text x="728" y="393" font-size="9" fill="#475569">lifts elapsed blocks so the ACL quota is not exhausted</text>

  <!-- footer note -->
  <rect x="24" y="440" width="952" height="72" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="462" font-size="11" font-weight="600" fill="#0f172a">Why the engine and the actions are separate</text>
  <text x="40" y="480" font-size="10" fill="#334155">The rule engine publishes an event saying an address should be blocked. It cannot block anything, because its IAM role grants no write permission of any kind.</text>
  <text x="40" y="496" font-size="10" fill="#334155">A fault in rule evaluation therefore cannot damage the environment, and each action's blast radius is bounded by its own role. Adding a fourth action means adding a rule, not editing the engine.</text>

  <text x="24" y="540" font-size="10" fill="#64748b">Observed during testing: quarantine_host failed on an IAM boundary while notify for the same playbook completed normally. EventBridge retried three times</text>
  <text x="24" y="556" font-size="10" fill="#64748b">and the ActionsFailed metric fired on each attempt. The failure stayed inside one action instead of stopping the response.</text>
</svg>
