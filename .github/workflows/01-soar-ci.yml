# Build and test the SOAR components (REQ-NCA-P2-11).
#
# Runs on every change to the SOAR code or playbooks. This is the gate: nothing
# reaches the deploy pipeline without passing here.
#
# The test suite uses only the Python standard library, with boto3 stubbed, so
# this job needs no dependency installation and cannot fail because a package
# index was unreachable.

name: SOAR CI

on:
  push:
    paths: ['soar/**', '.github/workflows/01-soar-ci.yml']
  pull_request:
    paths: ['soar/**']
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Compile every handler
        shell: bash
        run: |
          python3 -m compileall -q soar
          echo "all handlers compile"

      - name: Run the test suite
        shell: bash
        working-directory: soar/tests
        run: |
          python3 -m unittest discover -s . -p "test_*.py" -v 2>&1 | tail -30

  playbooks:
    name: Playbook integrity
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Validate playbooks.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys

          pb = json.load(open('soar/playbooks/playbooks.json'))
          books = pb['playbooks']
          errors = []

          ids = [p['id'] for p in books]
          if len(ids) != len(set(ids)):
              errors.append(f'duplicate playbook ids: {ids}')

          implemented = {'block_ip', 'quarantine_host', 'notify'}
          valid_severity = {'critical', 'high', 'medium', 'low'}

          for p in books:
              pid = p['id']
              if not p.get('match'):
                  errors.append(f'{pid}: no match criteria, would match nothing')
              if not p.get('actions'):
                  errors.append(f'{pid}: no actions, would do nothing')
              for a in p.get('actions', []):
                  if a['type'] not in implemented:
                      errors.append(f"{pid}: action '{a['type']}' has no handler")
              for s in p.get('match', {}).get('severity', []):
                  if s not in valid_severity:
                      errors.append(f"{pid}: unknown severity '{s}'")
              t = p.get('conditions', {}).get('threshold')
              if t and (t.get('count', 0) < 2 or t.get('window_minutes', 0) < 1):
                  errors.append(f'{pid}: threshold is not a meaningful correlation')

          if errors:
              print('PLAYBOOK VALIDATION FAILED')
              for e in errors:
                  print('  ', e)
              sys.exit(1)

          enabled = [p['id'] for p in books if p.get('enabled', True)]
          print(f'{len(books)} playbooks valid, {len(enabled)} enabled: {", ".join(enabled)}')
          PY

  package:
    name: Package deployment artefacts
    runs-on: self-hosted
    needs: [test, playbooks]
    steps:
      - uses: actions/checkout@v4

      - name: Build function archives
        shell: bash
        run: |
          mkdir -p artefacts
          cd soar
          for d in collector rule-engine actions/block_ip actions/quarantine_host actions/notify; do
            name=$(basename "$d")
            (cd "$d" && zip -qr "../../../artefacts/${name}.zip" . -x "__pycache__/*")
            echo "packaged ${name}"
          done
          # the rule engine ships with its playbooks so code and rules cannot drift
          cd "$GITHUB_WORKSPACE"
          (cd soar/playbooks && zip -q "$GITHUB_WORKSPACE/artefacts/rule-engine.zip" playbooks.json)
          ls -la artefacts

      - uses: actions/upload-artifact@v4
        with:
          name: soar-functions
          path: artefacts/
          retention-days: 7
