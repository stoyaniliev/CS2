# Build the SOAR console container and deploy it to the k3s platform
# (REQ-NCA-P2-07, REQ-NCA-P2-11).
#
# This is the pipeline the core assignment asks for when it says to deploy SOAR
# components to the container platform using CI/CD. It builds an image, pushes
# it to ECR, and rolls it out to k3s.
#
# The image tag is the commit SHA rather than 'latest'. Two reasons: the running
# revision can be traced back to a commit, and Kubernetes will not roll out a
# change when the tag is unchanged, so 'latest' would silently deploy nothing.
#
# The runner reaches the cluster over SSH through the bastion, since the k3s API
# has no public address.

# Shell is pinned to Git Bash by absolute path. On Windows the runner resolves
# 'bash' from PATH, and C:\Windows\System32\bash.exe (the WSL launcher) comes
# first on a default install. With no WSL distro present that fails with
# 'execvpe(/bin/bash) failed', which is confusing because the error looks like a
# missing script rather than the wrong interpreter.
name: SOAR Console

on:
  push:
    branches: [main]
    paths: ['soar/console/**', '.github/workflows/03-soar-console.yml']
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  ECR_REPO: 182460207849.dkr.ecr.eu-central-1.amazonaws.com/innovatech/soar
  BASTION: ubuntu@63.183.208.221
  K3S_NODE: 10.1.10.149

defaults:
  run:
    shell: 'C:\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
jobs:
  build:
    name: Build and push
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive the image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Verify the application compiles before building an image
        run: |
          PYBIN=""
          # The Microsoft Store ships stub executables named python.exe and
          # python3.exe that exist on PATH but only print an install message and
          # exit 1, so presence is not enough. Each candidate is executed.
          for c in python python3 py; do
            if command -v "$c" >/dev/null 2>&1 && "$c" -c "import sys" >/dev/null 2>&1; then
              PYBIN="$c"; break
            fi
          done
          if [ -z "$PYBIN" ]; then
            echo "::error::No working Python interpreter found. Install Python 3.10+ from python.org with Add to PATH enabled."
            exit 1
          fi
          echo "using $PYBIN ($($PYBIN --version 2>&1))"
          $PYBIN -m py_compile soar/console/app.py

      - name: Authenticate to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR_REPO%/*}"

      - name: Build
        working-directory: soar/console
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${ECR_REPO}:console-${{ steps.meta.outputs.tag }}" \
            -t "${ECR_REPO}:console-latest" .

      - name: Smoke test the image before it leaves the runner
        run: |
          docker run -d --name smoke -p 18080:8080 \
            -e AWS_REGION="$AWS_REGION" \
            "${ECR_REPO}:console-${{ steps.meta.outputs.tag }}"
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18080/healthz > /dev/null 2>&1; then
              echo "container healthy after ${i}s"
              docker rm -f smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::container failed its health check"
          docker logs smoke
          docker rm -f smoke
          exit 1

      - name: Push
        run: |
          docker push "${ECR_REPO}:console-${{ steps.meta.outputs.tag }}"
          docker push "${ECR_REPO}:console-latest"

      - name: Scan results
        continue-on-error: true
        run: |
          sleep 20
          aws ecr describe-image-scan-findings \
            --repository-name innovatech/soar \
            --image-id imageTag="console-${{ steps.meta.outputs.tag }}" \
            --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts' --output json || \
            echo "scan not complete yet"

  deploy:
    name: Deploy to k3s
    runs-on: self-hosted
    needs: build
    # No approval gate. A container rollout is reversible in one command, uses
    # maxUnavailable: 0 so there is no gap in service, and the image was smoke
    # tested on the runner before it was pushed. Requiring a human here would be
    # ceremony without a corresponding risk.
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the current instance addresses
        working-directory: terraform
        continue-on-error: true
        run: |
          # The addresses in the env block are defaults. Terraform knows the
          # real ones, and both change whenever an instance is replaced.
          terraform init -input=false > /dev/null 2>&1 || true
          if terraform output -raw bastion_public_ip > /dev/null 2>&1; then
            echo "BASTION=ubuntu@$(terraform output -raw bastion_public_ip)" >> "$GITHUB_ENV"
            echo "K3S_NODE=$(terraform output -raw k3s_private_ip)" >> "$GITHUB_ENV"
            echo "resolved from terraform state:"
            echo "  bastion  $(terraform output -raw bastion_public_ip)"
            echo "  k3s node $(terraform output -raw k3s_private_ip)"
          else
            echo "No terraform state available, using the workflow defaults."
          fi

      - name: Prepare SSH access
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          KEY=~/.ssh/innovatech.pem

          printf '%s\n' "${{ secrets.BASTION_SSH_KEY }}" > "$KEY"

          # A secret pasted from Windows carries CRLF line endings, which
          # OpenSSH rejects with an unhelpful "Permission denied (publickey)"
          # rather than a parse error.
          tr -d '\r' < "$KEY" > "$KEY.clean" && mv "$KEY.clean" "$KEY"
          chmod 600 "$KEY"

          if [ ! -s "$KEY" ]; then
            echo "::error::BASTION_SSH_KEY is empty or unset."
            exit 1
          fi
          if ! ssh-keygen -y -f "$KEY" > /tmp/pub 2>/tmp/keyerr; then
            echo "::error::BASTION_SSH_KEY is not a valid private key."
            cat /tmp/keyerr
            exit 1
          fi
          echo "key fingerprint from the secret:"
          ssh-keygen -lf /tmp/pub

          # An SSH config rather than command line flags, because -J does NOT
          # pass -i to the jump hop. The identity applies only to the final
          # destination, so the connection to the bastion itself falls back to
          # default identities, finds none, and fails with "Permission denied
          # (publickey)" that looks like a problem with the key. Naming the
          # IdentityFile per host removes the ambiguity.
          cat > ~/.ssh/config <<CONF
          Host bastion
            HostName ${BASTION#*@}
            User ubuntu
            IdentityFile ~/.ssh/innovatech.pem
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts

          Host k3s
            HostName ${K3S_NODE}
            User ubuntu
            IdentityFile ~/.ssh/innovatech.pem
            IdentitiesOnly yes
            ProxyJump bastion
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          CONF
          chmod 600 ~/.ssh/config
          sed -i 's/^          //' ~/.ssh/config
          echo "--- ssh config ---"
          cat ~/.ssh/config

      - name: Confirm both hops authenticate
        run: |
          echo "bastion:"
          ssh -o BatchMode=yes -o ConnectTimeout=10 bastion 'hostname' || {
            echo "::error::Cannot authenticate to the bastion. Check BASTION_SSH_KEY matches innovatech-key.pem, and that your runner's public address is permitted by the bastion security group."
            exit 1
          }
          echo "k3s node through the bastion:"
          ssh -o BatchMode=yes -o ConnectTimeout=15 k3s 'hostname' || {
            echo "::error::Reached the bastion but not the k3s node. Check the k3s address is current: terraform output k3s_private_ip"
            exit 1
          }

      - name: Render the manifests
        run: |
          sed -e "s|IMAGE_PLACEHOLDER|${ECR_REPO}:console-${{ needs.build.outputs.tag }}|" \
              -e "s|VERSION_PLACEHOLDER|${{ needs.build.outputs.tag }}|" \
              soar/console/k8s/deployment.yaml > /tmp/soar-console.yaml
          grep -E 'image:|APP_VERSION' -A1 /tmp/soar-console.yaml | head

      - name: Apply through the bastion
        run: |
          scp /tmp/soar-console.yaml k3s:/tmp/
          ssh k3s 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && \
                   kubectl apply -f /tmp/soar-console.yaml'

      - name: Wait for the rollout to complete
        run: |
          ssh k3s 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && \
                   kubectl -n soar rollout status deployment/soar-console --timeout=180s'

      - name: Verify the deployed version is the one just built
        run: |
          running=$(ssh k3s 'export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && \
            kubectl -n soar get deploy soar-console -o jsonpath="{.spec.template.spec.containers[0].image}"')
          echo "running image: ${running}"
          [ "${running##*:}" = "console-${{ needs.build.outputs.tag }}" ]

      - name: Confirm the service answers
        run: |
          ssh k3s 'curl -fsS http://127.0.0.1:30080/healthz && echo " console responding"'

      - name: Summary
        run: |
          {
            echo "### SOAR console deployed"
            echo ""
            echo "Image tag: \`console-${{ needs.build.outputs.tag }}\`"
            echo ""
            echo "Reachable on the k3s node at port 30080. Tunnel with:"
            echo ""
            echo '```'
            echo "ssh -i innovatech-key.pem -L 8080:${K3S_NODE}:30080 ${BASTION} -N"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/innovatech.pem ~/.ssh/config
