# Validate, plan and deploy the infrastructure and the SOAR functions
# (REQ-NCA-P2-11, REQ-NCA-P2-12).
#
# Runs on a self-hosted runner because the plan needs credentials for a private
# account and, once the runner is joined to the tailnet, a network path to
# resources that have no public address.
#
# Deployment is automatic, but graded by risk. The plan is inspected for
# destructive changes: if it only adds or updates, it applies on merge without
# waiting for anyone. If it would destroy anything, it routes through an
# environment that requires approval before proceeding.
#
# The reasoning is that "deploy automatically" and "never let a pipeline delete
# production infrastructure unattended" are both correct, and they only conflict
# if risk is treated as uniform. An added Lambda and a destroyed Transit Gateway
# attachment are not the same event and should not need the same ceremony.

# Shell is pinned to Git Bash by absolute path. On Windows the runner resolves
# 'bash' from PATH, and C:\Windows\System32\bash.exe (the WSL launcher) comes
# first on a default install. With no WSL distro present that fails with
# 'execvpe(/bin/bash) failed', which is confusing because the error looks like a
# missing script rather than the wrong interpreter.
name: Infrastructure

on:
  push:
    branches: [main]
        paths: ['terraform/**', 'soar/**', '.github/workflows/02-infrastructure.yml']
  pull_request:
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'plan or apply'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: 'true'

  # terraform.tfvars is gitignored because it holds a live Tailscale auth key,
  # so the runner has no copy of it. Terraform reads TF_VAR_* from the
  # environment, which lets the values come from repository secrets instead of
  # a file that must never be committed.
  #
  # admin_ip_cidr is deliberately absent: it auto-detects, and the runner sits
  # on the same connection as the operator, so the detected address is correct.
  TF_VAR_tailscale_auth_key: ${{ secrets.TAILSCALE_AUTH_KEY }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

defaults:
  run:
    shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    working-directory: terraform

jobs:
  validate:
    name: Format and validate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        # -diff omitted deliberately: it shells out to a diff binary that does
        # not exist on Windows. The check still fails on badly formatted files,
        # it just reports which files rather than showing the changes.
        run: |
          if ! terraform fmt -check -recursive; then
            echo "::error::Run 'terraform fmt -recursive' locally and commit the result."
            exit 1
          fi
          echo "formatting is clean"

      - name: Initialise without a backend
        # No credentials required for a syntax and reference check, so this
        # job still passes on a runner with no AWS session.
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  plan:
    name: Plan
    runs-on: self-hosted
    needs: validate
    outputs:
      destroys: ${{ steps.risk.outputs.destroys }}
      changes: ${{ steps.risk.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm credentials and required variables
        run: |
          if ! aws sts get-caller-identity > /dev/null 2>&1; then
            echo "::error::No valid AWS session on the runner. Run 'aws sso login' and retry."
            exit 1
          fi
          aws sts get-caller-identity --query Arn --output text

          missing=0
          if [ -z "${TF_VAR_tailscale_auth_key}" ]; then
            echo "::error::Secret TAILSCALE_AUTH_KEY is not set. Add it under Settings, Secrets and variables, Actions."
            missing=1
          fi
          if [ -z "${TF_VAR_alert_email}" ]; then
            echo "::error::Secret ALERT_EMAIL is not set."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "required variables present" 

      - name: Initialise
        run: terraform init -input=false

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tf.plan | tee plan.txt
          echo "summary=$(grep -E '^Plan:|No changes' plan.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Grade the risk of this plan
        id: risk
        run: |
          # A plan that only adds or updates is applied automatically. A plan
          # that destroys anything is routed through manual approval instead.
          destroys=$(grep -oE '[0-9]+ to destroy' plan.txt | grep -oE '^[0-9]+' | head -1 || echo 0)
          destroys=${destroys:-0}
          if grep -q 'No changes' plan.txt; then changes=false; else changes=true; fi

          echo "destroys=${destroys}" >> "$GITHUB_OUTPUT"
          echo "changes=${changes}"   >> "$GITHUB_OUTPUT"

          if [ "$destroys" -gt 0 ]; then
            echo "::warning::This plan destroys ${destroys} resource(s) and will require approval."
            grep -E '^  # .* will be destroyed|^  # .* must be replaced' plan.txt || true
          else
            echo "Plan is additive only. It will apply without approval."
          fi

      - name: Summary
        run: |
          {
            echo "### Terraform plan"
            echo ""
            echo '```'
            grep -E '^  # |^Plan:|^No changes' plan.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tf.plan
          retention-days: 5

  # Additive plans deploy on merge with no human involvement. This is the path
  # a normal change takes: a new playbook, a Lambda code update, an added rule.
  apply-auto:
    name: Apply (automatic)
    runs-on: self-hosted
    needs: plan
    if: |
      needs.plan.outputs.changes == 'true' &&
      needs.plan.outputs.destroys == '0' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    steps:
      - uses: actions/checkout@v4

      - name: Initialise
        run: terraform init -input=false

      - name: Apply
        run: |
          echo "Additive plan, applying without approval."
          terraform apply -input=false -auto-approve

      - name: Report outputs
        run: |
          {
            echo "### Deployed automatically"
            echo ""
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Anything that would destroy or replace a resource stops here until a person
  # approves it in the production environment.
  apply-reviewed:
    name: Apply (approval required)
    runs-on: self-hosted
    needs: plan
    if: needs.plan.outputs.destroys != '0'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Initialise
        run: terraform init -input=false

      - name: Apply
        run: |
          echo "Plan destroys ${{ needs.plan.outputs.destroys }} resource(s), approved by a reviewer."
          terraform apply -input=false -auto-approve

      - name: Report outputs
        run: |
          {
            echo "### Deployed after approval"
            echo ""
            echo "Destroyed or replaced: ${{ needs.plan.outputs.destroys }} resource(s)"
            echo ""
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Post-deployment verification
    runs-on: self-hosted
    needs: [apply-auto, apply-reviewed]
    if: |
      always() &&
      (needs.apply-auto.result == 'success' || needs.apply-reviewed.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Confirm every SOAR function is active
        run: |
          fail=0
          for fn in collector rule-engine action-block-ip action-quarantine-host \
                    action-notify block-expiry; do
            state=$(aws lambda get-function --function-name "innovatech-soar-${fn}" \
              --query 'Configuration.State' --output text --region "$AWS_REGION" 2>/dev/null || echo MISSING)
            echo "innovatech-soar-${fn}: ${state}"
            [ "$state" = "Active" ] || fail=1
          done
          exit $fail

      - name: Confirm the queue trigger is enabled
        run: |
          state=$(aws lambda list-event-source-mappings \
            --function-name innovatech-soar-rule-engine \
            --query 'EventSourceMappings[0].State' --output text --region "$AWS_REGION")
          echo "rule engine trigger: ${state}"
          [ "$state" = "Enabled" ]

      - name: Confirm both dead-letter queues are empty
        run: |
          for q in innovatech-soar-ingest-dlq innovatech-soar-action-dlq; do
            url=$(aws sqs get-queue-url --queue-name "$q" --query QueueUrl --output text --region "$AWS_REGION")
            n=$(aws sqs get-queue-attributes --queue-url "$url" \
              --attribute-names ApproximateNumberOfMessages \
              --query 'Attributes.ApproximateNumberOfMessages' --output text --region "$AWS_REGION")
            echo "${q}: ${n} message(s)"
            if [ "$n" != "0" ]; then
              echo "::warning::${q} is not empty"
            fi
          done
