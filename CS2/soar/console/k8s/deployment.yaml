apiVersion: v1
kind: Namespace
metadata:
  name: soar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soar-console
  namespace: soar
  labels:
    app: soar-console
    component: soar
spec:
  replicas: 2          # survives a pod restart without the dashboard disappearing
  selector:
    matchLabels:
      app: soar-console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # no gap in availability during a deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app: soar-console
        component: soar
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: console
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AWS_REGION
              value: eu-central-1
            - name: EVENTS_TABLE
              value: innovatech-soar-events
            - name: BLOCKS_TABLE
              value: innovatech-soar-blocks
            - name: QUARANTINE_TABLE
              value: innovatech-soar-quarantines
            - name: APP_VERSION
              value: VERSION_PLACEHOLDER
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: soar-console
  namespace: soar
  labels:
    app: soar-console
spec:
  type: NodePort
  selector:
    app: soar-console
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
