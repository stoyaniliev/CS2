<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#15803d"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1180" height="860" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#0f172a">Innovatech Solutions — Hybrid Network Architecture</text>
  <text x="24" y="55" font-size="12" fill="#64748b">AWS eu-central-1 (Frankfurt) · hub-and-spoke over Transit Gateway · REQ-NCA-P2-01 to P2-04</text>

  <!-- ON PREM -->
  <rect x="24" y="90" width="250" height="250" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="40" y="114" font-size="13" font-weight="600" fill="#713f12">ON-PREMISES</text>
  <text x="40" y="132" font-size="11" fill="#854d0e">192.168.100.0/24</text>
  <rect x="44" y="148" width="210" height="46" rx="5" fill="#ffffff" stroke="#ca8a04"/>
  <text x="56" y="167" font-size="11" font-weight="600" fill="#0f172a">corp-server</text>
  <text x="56" y="183" font-size="10" fill="#475569">rsyslog · node_exporter</text>
  <rect x="44" y="204" width="210" height="46" rx="5" fill="#ffffff" stroke="#ca8a04"/>
  <text x="56" y="223" font-size="11" font-weight="600" fill="#0f172a">corp-workstation</text>
  <text x="56" y="239" font-size="10" fill="#475569">event source</text>
  <rect x="44" y="260" width="210" height="42" rx="5" fill="#ffffff" stroke="#ca8a04" stroke-dasharray="3 2"/>
  <text x="56" y="278" font-size="11" font-weight="600" fill="#0f172a">Tailscale node</text>
  <text x="56" y="293" font-size="10" fill="#475569">WireGuard mesh, per-node auth</text>

  <!-- tunnel -->
  <line x1="274" y1="215" x2="344" y2="215" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#a)"/>
  <text x="278" y="207" font-size="10" fill="#854d0e">encrypted overlay</text>

  <!-- HUB -->
  <rect x="344" y="90" width="300" height="330" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="114" font-size="13" font-weight="600" fill="#1e3a8a">HUB VPC</text>
  <text x="360" y="132" font-size="11" fill="#1d4ed8">10.0.0.0/16 · shared services</text>

  <rect x="362" y="146" width="264" height="60" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="374" y="164" font-size="11" font-weight="600" fill="#0f172a">Public subnets — 10.0.0.0/24, 10.0.1.0/24</text>
  <text x="374" y="180" font-size="10" fill="#475569">hybrid-gw: bastion + Tailscale subnet router</text>
  <text x="374" y="195" font-size="10" fill="#475569">NAT gateway (single — documented SPOF)</text>

  <rect x="362" y="216" width="264" height="74" rx="5" fill="#ffffff" stroke="#2563eb"/>
  <text x="374" y="234" font-size="11" font-weight="600" fill="#0f172a">Private subnets — 10.0.10.0/24, 10.0.11.0/24</text>
  <text x="374" y="250" font-size="10" fill="#475569">Route53 Resolver inbound (10.0.10.250, 10.0.11.194)</text>
  <text x="374" y="265" font-size="10" fill="#475569">execute-api interface endpoint</text>
  <text x="374" y="280" font-size="10" fill="#475569">innovatech.internal private hosted zone</text>

  <rect x="362" y="300" width="264" height="36" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="3 2"/>
  <text x="374" y="323" font-size="10" fill="#1e3a8a">TGW subnets 10.0.240.0/28, 10.0.240.16/28</text>

  <line x1="644" y1="200" x2="700" y2="200" stroke="#2563eb" stroke-width="2"/>
  <text x="648" y="193" font-size="10" fill="#1d4ed8">IGW → internet</text>
  <circle cx="712" cy="200" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <!-- TGW -->
  <rect x="404" y="452" width="180" height="66" rx="8" fill="#1e293b"/>
  <text x="494" y="478" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">TRANSIT GATEWAY</text>
  <text x="494" y="497" font-size="10" fill="#cbd5e1" text-anchor="middle">default assoc/propagation OFF</text>
  <text x="494" y="510" font-size="10" fill="#cbd5e1" text-anchor="middle">2 route tables: hub / spoke</text>

  <line x1="494" y1="420" x2="494" y2="452" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- PLATFORM SPOKE -->
  <rect x="24" y="560" width="440" height="270" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="40" y="584" font-size="13" font-weight="600" fill="#14532d">PLATFORM SPOKE</text>
  <text x="40" y="602" font-size="11" fill="#15803d">10.1.0.0/16 · private subnets only, no IGW</text>

  <rect x="42" y="616" width="404" height="84" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="54" y="634" font-size="11" font-weight="600" fill="#0f172a">k3s server (t3.large)</text>
  <text x="54" y="651" font-size="10" fill="#475569">Prometheus · Alertmanager · Loki · Grafana · Alloy</text>
  <text x="54" y="666" font-size="10" fill="#475569">cloudwatch-exporter → SOAR metrics into Prometheus</text>
  <text x="54" y="683" font-size="10" fill="#475569">Loki chunks + index → S3 via gateway endpoint</text>

  <rect x="42" y="710" width="196" height="58" rx="5" fill="#ffffff" stroke="#16a34a"/>
  <text x="54" y="728" font-size="11" font-weight="600" fill="#0f172a">demo-workstation</text>
  <text x="54" y="744" font-size="10" fill="#475569">SOARable=true</text>
  <text x="54" y="759" font-size="10" fill="#b91c1c">quarantine target</text>

  <rect x="250" y="710" width="196" height="58" rx="5" fill="#ecfdf5" stroke="#16a34a" stroke-dasharray="3 2"/>
  <text x="262" y="728" font-size="11" font-weight="600" fill="#0f172a">VPC endpoints</text>
  <text x="262" y="744" font-size="10" fill="#475569">S3 · DynamoDB (gateway)</text>
  <text x="262" y="759" font-size="10" fill="#475569">execute-api (interface)</text>

  <text x="42" y="792" font-size="10" fill="#15803d">Network ACL acl-068c30bc… — SOAR writes DENY entries here (rules 100–400)</text>
  <text x="42" y="810" font-size="10" fill="#15803d">Default route 0.0.0.0/0 → TGW → hub NAT</text>

  <line x1="404" y1="500" x2="300" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- DATA SPOKE -->
  <rect x="500" y="560" width="330" height="270" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="516" y="584" font-size="13" font-weight="600" fill="#701a75">DATA SPOKE</text>
  <text x="516" y="602" font-size="11" fill="#a21caf">10.2.0.0/16 · NO default route at all</text>

  <rect x="518" y="616" width="294" height="70" rx="5" fill="#ffffff" stroke="#a21caf"/>
  <text x="530" y="634" font-size="11" font-weight="600" fill="#0f172a">S3 gateway endpoint</text>
  <text x="530" y="651" font-size="10" fill="#475569">innovatech-observability-9e024ca1</text>
  <text x="530" y="666" font-size="10" fill="#475569">lifecycle: IA at 30d, expire at 90d</text>
  <text x="530" y="681" font-size="10" fill="#475569">metrics.innovatech.internal</text>

  <rect x="518" y="698" width="294" height="72" rx="5" fill="#fae8ff" stroke="#a21caf" stroke-dasharray="3 2"/>
  <text x="530" y="717" font-size="11" font-weight="600" fill="#701a75">Structural guarantee</text>
  <text x="530" y="734" font-size="10" fill="#86198f">No route to any gateway exists in this spoke.</text>
  <text x="530" y="749" font-size="10" fill="#86198f">Internet exposure is impossible regardless of</text>
  <text x="530" y="764" font-size="10" fill="#86198f">security group configuration. (REQ-P2-03)</text>

  <line x1="560" y1="500" x2="620" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- SOAR panel -->
  <rect x="866" y="90" width="290" height="500" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="882" y="114" font-size="13" font-weight="600" fill="#7f1d1d">SOAR PIPELINE</text>
  <text x="882" y="132" font-size="11" fill="#b91c1c">regional services — no VPC attachment</text>

  <rect x="882" y="146" width="258" height="46" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="894" y="164" font-size="11" font-weight="600" fill="#0f172a">Private API Gateway</text>
  <text x="894" y="181" font-size="10" fill="#475569">resource policy: VPCe only</text>

  <rect x="882" y="204" width="258" height="46" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="894" y="222" font-size="11" font-weight="600" fill="#0f172a">collector</text>
  <text x="894" y="239" font-size="10" fill="#475569">normalise → DynamoDB + SQS</text>

  <rect x="882" y="262" width="258" height="52" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="894" y="280" font-size="11" font-weight="600" fill="#0f172a">rule engine</text>
  <text x="894" y="296" font-size="10" fill="#475569">declarative playbooks, correlation</text>
  <text x="894" y="309" font-size="10" fill="#15803d">no write permissions of any kind</text>

  <rect x="882" y="326" width="258" height="40" rx="5" fill="#1e293b"/>
  <text x="894" y="351" font-size="11" font-weight="600" fill="#ffffff">EventBridge bus + DLQ</text>

  <rect x="882" y="378" width="258" height="40" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="894" y="396" font-size="11" font-weight="600" fill="#0f172a">block_ip</text>
  <text x="894" y="411" font-size="10" fill="#475569">writes NACL DENY entry</text>

  <rect x="882" y="428" width="258" height="40" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="894" y="446" font-size="11" font-weight="600" fill="#0f172a">quarantine_host</text>
  <text x="894" y="461" font-size="10" fill="#475569">swaps to isolation security group</text>

  <rect x="882" y="478" width="258" height="40" rx="5" fill="#ffffff" stroke="#b91c1c"/>
  <text x="894" y="496" font-size="11" font-weight="600" fill="#0f172a">notify</text>
  <text x="894" y="511" font-size="10" fill="#475569">SNS email to operations</text>

  <rect x="882" y="528" width="258" height="46" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="3 2"/>
  <text x="894" y="546" font-size="10" fill="#7f1d1d">block_expiry (every 5 min) lifts blocks</text>
  <text x="894" y="561" font-size="10" fill="#7f1d1d">whose duration has elapsed</text>

  <!-- alert flow -->
  <path d="M 446 640 C 700 640, 700 200, 882 172" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="660" y="430" font-size="10" fill="#15803d" transform="rotate(-52 660 430)">Alertmanager webhook (REQ-P2-09)</text>

  <!-- response flow -->
  <path d="M 882 398 C 700 398, 560 700, 250 745" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="600" y="560" font-size="10" fill="#b91c1c" transform="rotate(24 600 560)">automated containment</text>

  <text x="24" y="852" font-size="10" fill="#64748b">Green = detection path (monitoring feeds SOAR) · Red = response path (SOAR changes network state) · Dashed purple = structural isolation</text>
</svg>
